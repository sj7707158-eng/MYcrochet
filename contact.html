<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch & Style - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html">Stitch & Style</a>
            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="portfolio.html">Portfolio</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container page-content">
        <div class="page-intro">
            <div class="section-label">Get In Touch</div>
            <h1>Contact Us</h1>
            <p>Have a project in mind? Send us a message and we will reply soon with ideas, pricing, and next steps.</p>
        </div>

        <form id="contact-form" class="contact-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Tell us about your order."></textarea>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Stitch & Style. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
